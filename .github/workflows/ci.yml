name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Usado pela validação de ambiente do Nest e pelo `prisma generate` na CI.
      DATABASE_URL: postgresql://plataforma:plataforma@localhost:5432/plataforma
      JWT_SECRET: ci-only-insecure-jwt-secret

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test
